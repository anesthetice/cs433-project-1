[project]
name = "ml-project-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "anesthetice", email = "118751106+anesthetice@users.noreply.github.com" }
]
requires-python = ">=3.14.8"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "seaborn>=0.13.2",
]

[dependency-groups]
test = ["pytest>=9.1.1"]
lint = ["ruff>=0.16.10"]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    "pyrefly>=1.3.2",
]

[tool.pytest.ini_options]
python_functions = "test_* *_test"
python_files = "test_*.py *_test.py*"
pythonpath = "."
testpaths = "tests/"
