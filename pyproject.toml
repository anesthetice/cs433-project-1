[project]
name = "ml-project-1"
version = "0.1.0"
description = "The repository for project 1 from the EPFL course cs-433"
readme = "README.md"
authors = [
    { name = "Elliot Currat", email = "elliot.currat@epfl.ch" },
    { name = "Anna Seres", email = "anna.seres@epfl.ch"},
    { name = "Alexandre Flusin", email = "alexandre.flusin@epfl.ch" },
]
requires-python = ">=3.14.8"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "seaborn>=0.13.2",
]

[dependency-groups]
test = ["pytest>=9.1.1"]
lint = ["ruff>=0.16.10"]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    "ipykernel>=7.4.0",
    "pyrefly>=1.3.2",
]

[tool.pytest.ini_options]
python_functions = "test_* *_test"
python_files = "test_*.py *_test.py*"
pythonpath = "."
testpaths = "tests/"
